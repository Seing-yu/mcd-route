"addOperator":"CN-GinoChenod","updateOperator":"CN-GinoChenod","addTime":"2025-12-17 08:40:18","updateTime":"2025-12-17 08:41:05","delFlag":0,"draftPageId":0,"draftFlag":0,"couponIds":[],"timeConds":{"forCoupons":[],"forAlias":[]},"coupons":[],"allCcoupons":[]},"configInfo":[{"id":"editor_0","component":"Block","alias":"RichText","moduleId":"editor_0","datasource":{"html":"<h4 style=\"text-align:center;\"><b id=\"xp2bb\">麦当劳MCP服务规则</b></h4><p><b>版本日期：</b>&nbsp;2025年12月3日</p><p><b>【重要提示】</b><b></b></p><p>本规则属于麦当劳《使用条款》的补充组成部分。在您点击“激活”或实际使用麦当劳MCP服务（以下简称“本服务”）前，请务必仔细阅读本规则。 <b>特别是以粗体标识的条款，涉及您的重大权益及免责事项，请您重点阅读。</b>&nbsp;如您不同意本规则的任何内容，请立即停止配置并取消生成连接凭证。</p><p><b></b></p><p><b>第一条 服务与使用授权</b><b></b></p><p><!--[if-->1.&nbsp;<!--[endif]--><b>服务性质：</b>&nbsp;本服务是指金拱门（中国）有限公司（下称“我们”或“麦当劳”）提供的、面向中国大陆地区（不含港澳台）的、遵循 MCP 标准的数据交互接口服务。该服务旨在让您通过自行使用的第三方 AI 工具访问与处理您在上述区域内的麦当劳会员权益相关信息及由您授权触发的相关操作。</p><p><!--[if-->2.&nbsp;<!--[endif]--><b>有限授权：</b>&nbsp;我们授予您一项<b>个人的、不可转让的、非独家且可随时撤销的</b>有限权利，允许您仅为个人非商业目的访问并使用本服务。</p><p><!--[if-->3.&nbsp;<!--[endif]--><b>权利保留：</b>&nbsp;本服务仅提供接口访问权，<b>您并未获得本服务的源代码、底层数据或相关知识产权</b>。麦当劳保留在任何时候对本服务进行调整、限制或终止的权利，并可基于安全或运营原因限制您的调用或吊销凭证。</p><p><b>第二条 凭证安全与账号责任</b><b></b></p><p><!--[if-->1.&nbsp;<!--[endif]-->您在配置页面生成的 <b>连接凭证 (MCP&nbsp;Token)</b>&nbsp;与您的麦当劳会员账号强绑定。<b>持有该凭证即代表拥有您账号的操作权限（包括但不限于查询营销活动日历、领取优惠券）。</b></p><p><!--[if-->2.&nbsp;<!--[endif]-->&nbsp;<b>严禁将凭证分享给他人、发布在公开网络或托管至非官方认证的第三方平台。</b></p><p><!--[if-->3.&nbsp;<!--[endif]-->&nbsp;凡是通过该凭证发起的任何指令，均视为您本人行为。<b>因凭证保管不当导致的权益损失、账号被盗用或被风控处理，由您自行承担，麦当劳不承担任何赔偿责任。</b><b></b></p><p><b>第三条 接口访问范围与技术限制</b><b></b></p><p><b></b></p><p>1. 您仅可通过本服务访问与您的会员权益相关的最小必要数据。禁止以任何方式诱导或尝试使用第三方 AI、脚本或工具获取超出本服务授权范围的内容。</p><p><b></b></p><p>2. 为保证系统稳定，我们会对接口调用频率进行限制。本服务仅面向个人正常使用场景，不支持任何形式的批量、高频或自动化调用。</p><p><b></b></p><p>3. 为保障系统安全，本服务设置相应的认证、风控及加密机制。您不得通过任何方式绕过、规避或干扰上述技术保护措施。</p><p><b></b></p><p><b>第四条 第三方技术风险与免责</b><b></b></p><p><!--[if-->1.&nbsp;<!--[endif]-->我们仅提供数据接口服务，不提供 AI 生成服务。 对话中的语义理解与内容生成均由您选用的第三方 AI 客户端及模型完成。</p><p><!--[if-->2.&nbsp;<!--[endif]-->您理解第三方 AI 模型可能会错误解读我们提供的数据。<b>麦当劳不承诺第三方 AI 回复内容的准确性。一切关于优惠券、活动及会员权益等信息，均严格以麦当劳 APP 内实际显示为准。</b></p><p><b>第五条 数据处理与隐私保护</b><b></b></p><p><!--[if-->1.&nbsp;<!--[endif]-->&nbsp;为了响应您的指令，您在 第三方AI工具输入的请求内容（Prompt）将经过您所选择的第三方模型服务商进行处理。</p><p><!--[if-->2.&nbsp;<!--[endif]-->请勿在与 AI 的对话中输入您的<b>MCP&nbsp;Token、支付密码、身份证号、银行卡号</b>或其他高度敏感的个人隐私信息。</p><p><!--[if-->3.&nbsp;<!--[endif]-->&nbsp;麦当劳将严格按照《麦当劳隐私政策》处理您的数据。我们不会存储、查看您的对话内容，仅收集与服务运行相关的必要日志（如调用时间、接口类型），用于服务优化与安全风控。</p><p>四、本平台仅面向中国大陆地区（不含港澳台）用户提供服务，用户通过本服务获取的数据及服务不适用任何其他国家或地区的数据保护法律法规（包括但不限于欧盟地区《通用数据保护条例》（GDPR））。</p><p><b>第六条 使用规范与禁止行为</b><b></b></p><p>您在使用本服务时，不得从事以下行为：</p><p><!--[if-->1.&nbsp;<!--[endif]-->将本服务用于代下单、代领券、倒卖优惠权益等商业牟利活动。</p><p><!--[if-->2.&nbsp;<!--[endif]-->利用脚本、爬虫或任何自动化工具调用本服务。</p><p><!--[if-->3.&nbsp;<!--[endif]-->&nbsp;尝试对本服务的接口逻辑、加密算法进行反向工程或破解。</p><p><b>若发生上述违规行为，麦当劳有权立即吊销您的连接凭证，并视情节严重程度对您的麦当劳会员账号采取限制措施或封号处理。</b></p><p><b>第七条 服务调整、中断与终止</b><b></b></p><p>您理解并同意：</p><p><!--[if-->1.&nbsp;<!--[endif]-->我们可能因安全、维护、政策变化、不可抗力等原因对本服务进行调整、中断或终止。</p><p><!--[if-->2.&nbsp;<!--[endif]-->我们不保证本服务的持续可用性或无故障性。</p><p><!--[if-->3.&nbsp;<!--[endif]-->因服务中断或调整造成的任何损失，我们不承担赔偿责任。</p><p><b>第八条 附则</b><b></b></p><p><!--[if-->1.&nbsp;<!--[endif]-->本规则与麦当劳《使用条款》冲突时，以本规则为准。</p><p><!--[if-->2.&nbsp;<!--[endif]-->我们有权根据运营与安全要求对本规则进行更新，更新后将于相关页面公布并自动生效。</p><p><!--[if-->3.&nbsp;<!--[endif]-->若您继续使用本服务，视为您已阅读并接受最新规则。</p>"},"style":{"margin":"0 15px 0 15px","textAlign":"left"},"conditions":{"TIME_PERIOD":[]},"templateData":[["editor_0",{}]],"sortedTemplate":null,"globalSetting":{"customStyle":"使用条款\n本使用条款适用于所有由金拱门（中国）有限公司（下称 “我们”或“麦当劳”）在大陆地区运营和管理的网站（简称“麦当劳网站”）、移动应用程序（包括麦当劳官方APP、麦当劳官方小程序等）、麦当劳门店WiFi、麦当劳门店自助点餐机及麦当劳中国官方认可的其他方式或平台（以下简称为“麦当劳官方平台”） 为您提供产品或服务。本使用条款在于规范您访问或使用任何麦当劳官方平台及在麦当劳官方平台购买产品或享受服务时我们与您之间的关系。\n\n如果您不满18岁，务必请您的家长或其他法定监护人（合称“监护人”）阅读本使用条款，并在征得您监护人同意的前提下访问或使用麦当劳官方平台、或通过麦当劳官方平台购买我们的产品、使用我们的服务或参与我们的活动。 如果您是未成年人的监护人，在未成年本人访问或使用麦当劳官方平台、或通过麦当劳官方平台购买我们的产品、使用我们的服务或参与我们的活动时，您应正确引导并予以监护。\n\n请您仔细阅读本使用条款，并特别注意其中的粗体字和加下划线的条款。您在访问或使用麦当劳官方平台或通过麦当劳官方平台购买我们的产品、使用我们的服务或参与我们的活动时，您应遵守本使用条款的规定。如果您不接受本使用条款的，请立即停止访问或使用麦当劳官方平台。如您使用或通过麦当劳官方平台购买我们的产品、使用我们的服务或参与我们的活动的，即表示您同意并遵守本使用条款的全部内容。。\n\n此外，如我们通过麦当劳官方平台提供其他特定的产品、服务、活动的，我们还将视具体情形制定单独的特别条款（或具有类似性质的其他法律文本）。当您通过麦当劳官方平台购买或使用产品或享受服务时，请务必同时阅读适用于该等特定产品或服务的特别条款。如相关的特别条款与本使用条款有不一致之处，适用该特别条款。。\n\n1. 真实信息\n\n为使我们能为您提供及时、准确的产品与服务，请您务必确认您向我们所提交的信息的完整性、真实性、有效性。必要时我们可能会要求您进行实名验证。一旦发现您的信息违反法律法规或不符合我们的业务规则的，我们可能会采取相关措施，例如停止为您提供产品或服务、中止或注销麦当劳会员账户（如已注册成为麦当劳会员）等。\n\n2. 订单管理\n\n您理解并同意：我们提供的服务或产品有赖于系统的准确运行及网络的及时响应。 若出现系统或网络故障、出错等，导致订单或页面展示错误、不当得利等情形，您同意我们可以采取更正差错、扣划款项、订单回转等适当的纠正措施。\n\n在下列情况下，麦当劳有权根据我们的合理判断，取消您的订单，且无须向您承担任何责任、赔偿或补偿；\n\n（1） 如麦当劳已和您协商一致的\n（2） 您填写的配送地址或配送信息不全（或存在错误），或我们无法将订单送达至您填写的配送地址的；\n（3） 您订购的产品数量超出正常消费需求的，或存在其他无法配送的情形的；\n（4） 您的订单被我们的内部安全系统识别为非正常普通订单或疑似欺诈订单的；\n（5） 订单显失公平，或存在其他重大误解情形的；\n（6） 冒充他人或盗用他人账户或身份下单的；\n（7） 您的订单来源于非麦当劳官方平台渠道或麦当劳授权平台或渠道的\n（8） 所订购的产品/服务并非用于个人正常消费或使用的目的，而是为了将商品转售给其他第三方的，或是以经营或盈利目的向第三方提供代下单服务的；\n（9） 因不可抗力（指我们不能预见、不能避免、不能克服的任何行为或事件，包括但不限于台风、地震、洪水、冰雹、火灾、爆炸、流行病等灾害事件，罢工、战争、骚乱、暴动、恐怖袭击或威胁等社会异常事件，以及网络传输延迟、数据交换堵塞、系统故障、遭受第三方攻击等电信、网络或系统问题）或其他麦当劳无法控制的情形导致无法履行订单的；\n（10） 您在购买商品过程中有任何侵犯其他用户正当权益或破坏麦当劳官方平台运营秩序的行为，或其他根据麦当劳的合理判断认定属于不正当的行为；\n（11） 利用平台漏洞、错误、故障、缺陷等来骗取或非法获取任何积分、补贴、优惠或其他权益（若有），以及获取任何超过正常消费范围内的利益；\n（12） 违反本使用条款，或违反与麦当劳官方平台相关的其他条款、政策或规则，或发生违背公平和诚实信用原则的情形；\n（13） 以及其他法律法规允许取消订单的情形；\n\n您有权根据本使用条款的约定，以及麦当劳其他的相关规则使用麦当劳官方平台。您承诺在使用麦当劳官方平台过程中，遵守法律法规及麦当劳官方平台规则，以诚实信用为基础使用麦当劳官方平台服务，不得利用麦当劳官方平台从事电信诈骗、洗钱、窃取商业秘密、窃取个人信息等违法犯罪活动，不会出现违反诚实信用原则、法律法规及麦当劳官方平台规则的情形。\n\n您理解并同意，在您进行账号注册或使用麦当劳官方平台时，如发现您账号可能存在涉诈等异常情形或风险的，麦当劳有权根据相关法律法规规定重新核验您的账号，并可根据风险情况，采取限期改正、限制功能、暂停使用、关闭账号、禁止重新注册以及本协议规定的其他处置措施。在向您提供麦当劳官方平台服务过程中，如发现涉诈等违法犯罪线索、风险信息的，麦当劳有权依照国家有关规定，根据涉诈风险类型、程度情况移送公安、金融、电信、网信等有权部门。\n\n若您对我们的上述处理有任何疑问，您可以申请恢复或解除限制您的使用功能，或要求麦当劳中国恢复为您提供服务。您可以根据本使用条款所述的联系方式致电“麦当劳顾客中心”，并根据客服提示，向麦当劳中国提供相关资料以及其他证明文件或信息，以便麦当劳中国进行核实。麦当劳中国将视具体事实和情节决定是否恢复您的使用功能或恢复为您提供服务。\n\n3. 会员注册\n\n如您同意并愿意在麦当劳官方平台创建账户成为麦当劳会员，您将根据麦当劳《会员服务协议》及其他相应的规则成为麦当劳会员。麦当劳会员在麦当劳官方平台使用会员账户时将享受麦当劳为您提供的会员服务。具体请参见麦当劳《会员服务协议》。\n\n如果您使用麦当劳官方平台和相关服务并注册账户的，您应提供真实、准确、完整、有效的信息，以完成账户的注册。我们会根据相关法律法规的要求，对您的账户进行实名验证，未通过实名验证的账户可能无法使用全部或部分功能。您使用第三方账户（如微信账号等）登录麦当劳官方平台的，您还应当遵守该等第三方账户管理有关的协议、规则等。\n\n您应负责维护您的账户和密码的保密性并限制第三方使用（或访问）您的设备。您理解麦当劳官方平台无法核实是否是您本人使用该账户和密码，您应当对在您的账户下发生的所有活动承担责任。\n\n您理解并同意，您违反法律法规或本使用条款之规定，或者其他损害麦当劳利益的情形，我们有权利终止您的账户、限制您访问麦当劳官方平台或使用其功能及服务，或删除全部或部分您的用户内容。\n\n4. 知识产权\n\n除非另有说明，麦当劳官方平台公开或显示的所有内容（包括但不限于文字、图表、照片、图像、标示、动画、视频、音效、插图及软件等）（合称“内容”），均属麦当劳及其关联方、许可方或供应商所有，且麦当劳官方平台内的所有组成要素（包括但不限于整体设计、脚本、代码、应用、内容等）均受相关知识产权法律法规的保护。\n\n如您通过麦当劳应用上传、发布或传输文字、图片、音频、视频（如有）等内容的，即视为您是前述内容的著作权人或合法授权人。为保障您能够正常使用、体验麦当劳官方平台提供的各项功能与服务，在法律允许的范围内，您在使用麦当劳应用时将前述内容公开发布、传播、分享的行为代表了您有权且同意不受时间限制地、不可撤销地、无需费用授予我们无地域限制地可对该等内容行使除专属于著作权人的人身权利以外的著作权权利（包括但不限于复制、发行、展览、表演、放映、传播您的内容，与上述权利相关的宣传和推广等服务的权利，含转授权及维权权利）。\n\n5. 赔偿\n\n如因您违反本使用条款，导致引起任何相关的责任、权利主张、索赔、损失、损害、费用的，您应当为麦当劳、麦当劳关联方及其管理人员、董事、雇员、代理人、被特许人以及供应商充分辩护，并使其免受损害，法律法规另有规定的除外。\n\n6. 责任限制\n\n麦当劳官方平台及内容均按其“现状”提供，麦当劳不对麦当劳官方平台及内容作出任何内容的陈述、保证或担保。麦当劳官方平台中显示或承载的信息仅以一般提供信息为目的，不应视为向您提供或提出任何形式的建议。\n\n请您理解，在使用本服务的过程中，可能会遇到不可抗力等风险因素，使本服务协议下的服务发生中断或终止。不可抗力是指不能预见、不能克服并不能避免且对一方或双方造成重大影响的客观事件，包括但不限于信息网络设备维护、信息网络连接故障、电脑、通讯或其他系统的故障、电力故障、罢工、劳动争议、暴乱、火灾、洪水、风暴、爆炸、战争、政府行为、法律法规变动、司法行政机关的命令、其他不可抗力或第三方的不作为而造成的不能服务或延迟服务等行为，在此情形下，麦当劳、麦当劳的任何关联方或被特许经营人，不对使用或无法使用麦当劳官方平台或其任何内容或服务所引起的损失承担责任，法律法规另有规定的除外。\n\n7. 与第三方的链接\n\n我们可能会不时地在麦当劳官方平台中提供或引用第三方拥有和控制的站点的链接。在您使用这些站点链接前，请务必仔细阅读这些站点的隐私权政策、使用条款和其他相关法律文本，并自行采取适当的操作。\n\n8. 禁止滥用\n\n禁止任何人使用麦当劳官方平台上传、发送或传播任何属于或可能属于违法、侵权、恐吓、欺诈、误导、煽动、淫秽、色情、暴恐、辱骂、歧视、教唆、诱导和具有其他非法性质或违反社会良好道德风尚与社会秩序的内容。一经发现，麦当劳可随时自行决定阻止您访问麦当劳官方平台或删除相关链接和内容。此外，禁止任何人使用麦当劳官方平台开展广告活动或实施任何商业招揽行为。\n\n禁止使用麦当劳官方平台的任何漏洞、错误、故障、缺陷等来骗取或非法获取任何积分、补贴、优惠或其他权益（若有），以及获取任何超过正常消费范围内的利益。我们一旦发现该等行为，将采取终止您的账户、取消您的订单/权益/活动资格等措施。\n\n9. 如何联系我们\n\n如您对本使用条款有任何疑问，您可以致电“麦当劳顾客中心”：400-920-0205（工作时间为每天9:00 – 18:00）。您也可以通过电子邮箱enquiry@cn.mcd.com与我们取得联系。\n\n10. 适用范围、适用法律与争议解决\n\n本条款适用于中华人民共和国大陆地区\n\n本条款的成立、生效、履行、解释及争议的解决均应适用中华人民共和国法律（不含港澳台地区）。\n\n因使用麦当劳官方平台或本条款而引起的或与之相关的任何争议，双方应先友好协商解决。协商不成时，任何一方均可向被告所在地人民法院提起诉讼。\n\n11. 使用条款的修订与生效\n\n本使用条款的更新日期为2024年4月3日（详见麦当劳官方APP“我的”-“条款与规则”–“公告”），并于2024年4月10日生效。麦当劳中国将根据具体情况的变化，不定期地修改本使用条款。变更后的使用条款将在修订生效前以麦当劳官方平台的公告、手机短信、电话、客户端推送或其他适当方式向您发送通知。若您在本使用条款及与本使用条款相关的业务规则内容生效后继续使用麦当劳官方平台的，即表示您已充分阅读、理解并接受修改后的使用条款和相关业务规则内容，并同意遵循修改后的使用条款和相关业务规则。\n","navConfig":{"mode":"simple","customData":{}}},"methods":{},"parentData":{},"widgets":[],"$styles":{},"css":{}},{"id":"global_setting","component":"GlobalSetting","alias":"GlobalSetting","style":{"minHeight":"100vh"},"needLocationFlag":0,"navConfig":{"mode":"simple","customData":{}},"datasource":{},"methods":{},"conditions":{},"parentData":{},"widgets":[],"$styles":{},"css":{}}]}</script><link href="/cms/assets/v1/static/css/5.f5183205.chunk.css" rel="stylesheet"><link href="/cms/assets/v1/static/css/index-page.9c08520f.081399d5.chunk.css" rel="stylesheet"></head><body><noscript>You need to enable JavaScript to run this app.</noscript><script>window._smReadyFuncs=[],window.SMSdk={onBoxDataReady:function(t){console.log("此时拿到的数据为boxData或者boxId",t)},ready:function(t){t&&_smReadyFuncs.push(t)}},window._smConf={organization:"qvdTr7A9k1DIU04ha4eP",appId:"default",publicKey:"MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCRqLWxDfQ923MlWGYPStfbKoq3H4KMIxnx7fMEaAGC07cA0OU2R9RFT0D27zTBkMgMXmpM0pqUsakjsJrmS0Tz4A+UJg93D2ROYkAIPKzVfOww4g6nCl79XYtAkc7ecGsoGYK911amH7nPwZxIrzxZ7NFKBU+6rJmseDSKeQkMDwIDAQAB",staticHost:"static.portal101.cn",protocol:"https",useShortBox:!0};var url=("https:"===document.location.protocol?"https://":"http://")+_smConf.staticHost+"/dist/web/v3.0.0/fp.min.js",sm=document.createElement("script"),s=document.getElementsByTagName("script")[0];sm.src=url,s.parentNode.insertBefore(sm,s)</script><script src="https://img.mcd.cn/gallery/43238eb2fdb48bee.js"></script><script>window.SMVdataSDK&&window.SMVdataSDK.init({publicKey:"MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCAlw8ebprQJZ+ZrO7cZ+uoOH6n3sC1ZY2E1vqipxLrOrEGFFWFvymyhmiD4jlNmI0eZsIxO/NJDhTLn35qHyGAT7VFn+lD2Qnjd3gu8Y0av1trny7DeMEAyyEZPT/JJSN1BLaLGERbYGOwD5ujqqoB1hWbRuT41FoIl9KXfGAm
